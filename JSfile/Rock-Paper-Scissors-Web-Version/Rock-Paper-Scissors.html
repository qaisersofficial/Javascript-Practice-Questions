<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper & Scissors</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
     <h1 class="text-4xl text-center mt-12 font-bold mb-6">Rock Paper Scissors</h1>

  <!-- Scoreboard -->
  <div class="flex space-x-12 mb-4 mx-44 text-xl rounded-lg border-2 border-dashed justify-center py-5">
    <div class="bg-white px-4 py-2 rounded shadow">
      You: <span id="player-score" class="font-bold">0</span>
    </div>
    <div class="bg-white px-4 py-2 rounded shadow">
      Computer: <span id="computer-score" class="font-bold">0</span>
    </div>
  </div>

  <!-- Buttons -->
  <div class="ml-8 flex space-x-4 mb-6">
    <button onclick="playGame('rock')" class="bg-white px-6 py-3 rounded-lg shadow hover:bg-gray-200">Rock</button>
    <button onclick="playGame('paper')" class="bg-white px-6 py-3 rounded-lg shadow hover:bg-gray-200">Paper</button>
    <button onclick="playGame('scissors')" class="bg-white px-6 py-3 rounded-lg shadow hover:bg-gray-200">Scissors</button>
  </div>

  <!-- Result Display -->
  <div class="text-xl ml-8 px-16 mb-2 font-semibold" id="result">Make your move!</div>
  <div id="choices" class="text-lg text-gray-700"></div>

  <button onclick="
  score.wins = 0;
  score.lose = 0;
  score.ties = 0;
  localStorage.removeItem('score');
  ">Reset Score</button>

  <script>
    const choices = ['rock', 'paper', 'scissors'];
    let playerScore = 0;
    let computerScore = 0;

    let score = JSON.parse(localStorage.getItem('score')) || {
    wins:0,
    lose:0,
    ties:0
};
    function playGame(playerChoice) {
      const computerChoice = choices[Math.floor(Math.random() * 3)];
      let result = '';

      if (playerChoice === computerChoice) {
        const element = document.getElementById("result");
        element.classList.add("text-yellow-700")
        result = "It's a draw!";
      } else if (
        (playerChoice === 'rock' && computerChoice === 'scissors') ||
        (playerChoice === 'paper' && computerChoice === 'rock') ||
        (playerChoice === 'scissors' && computerChoice === 'paper')
      ) {
        document.getElementById('result').style.cssText = "color:green;"
        result = 'You win!';
        playerScore++;
      } else {
        document.getElementById('result').style.cssText = "color:red;"
        result = 'You lose!';
        computerScore++;
      }
      if( result === "It's a draw!"){
        score.ties++;
      }else if(result === 'You win!'){
        score.wins++;
      }else if(result === 'You lose!'){
        score.lose++;
      }
      localStorage.setItem("score", JSON.stringify(score));

      document.getElementById('result').textContent = result;
      document.getElementById('choices').innerHTML = `<p>You choose <span class="text-blue-500"> ${playerChoice} </span> & Computer choose <span class="text-blue-500">${computerChoice}</span></p>`;
      document.getElementById('player-score').textContent = playerScore;
      document.getElementById('computer-score').textContent = computerScore;

      alert(`Total Number of Wins:${score.wins}
Total Number of loses: ${score.lose}
Total Number of Ties:${score.ties}`)
    }
  </script>

</body>
</html>
</body>
</html>
