<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript DOM</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="text-center mt-12">
    <h1>DOM <span class="text-blue-500">Demo</span></h1>
        <h3>
            Topic1: <span class="text-blue-800"> Starter Code</span>
        </h3>
        <p>Revising the topics about DOM </p>
    </div>
    <div class="mt-4 text-center">
        <button id="incbtn" type="button" class="cursor-pointer inline-flex items-center px-5 py-2.5 text-sm font-medium text-center text-white bg-blue-700 rounded-lg hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
    Messages
    <span id="displayVal" class="inline-flex items-center justify-center w-4 h-4 ms-2 text-xs font-semibold text-blue-800 bg-blue-200 rounded-full">
    0
    </span>
    </button>
    </div>

    <script>
        const button = document.querySelector("#incbtn");
        const showValue = document.querySelector("#displayVal");
        let counter = 0;
        button.onclick = function (){
            counter++;
            showValue.textContent = counter;
        }
    </script>

</body>
</html>
